<!-- Знак GameMind «сетка ответов» (C-a): три верных, одна мимо — на тёмной плитке табло.
     Сетка 4/10/4 в единицах 32 = ровные пиксели в 16 px (2/5/2): иначе вкладка мылит.
     Плитка тёмная в обеих темах браузера: знак одинаково читается на светлой и тёмной вкладке.
     Источник для favicon.ico / apple-icon / иконок PWA: node scripts/build-favicon.cjs.
     Шапка рисует тот же знак без плитки: src/shared/ui/game-mind-mark.tsx.
     Canon: docs/DECISIONS.md → Brand mark: answer grid. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="7" fill="#14181f" />
    <rect x="4" y="4" width="10" height="10" rx="2.5" fill="#3ecf8e" />
    <rect x="18" y="4" width="10" height="10" rx="2.5" fill="#3ecf8e" />
    <rect x="4" y="18" width="10" height="10" rx="2.5" fill="#3ecf8e" />
    <rect x="18" y="18" width="10" height="10" rx="2.5" fill="#f47e84" />
</svg>
